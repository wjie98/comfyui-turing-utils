[build-system]
requires = ["setuptools>=69", "wheel", "torch>=2.6", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-turing-utils-kernel"
version = "0.42.0"
description = "Turing operators and multi-architecture integer attention for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*", "NOTICE"]
authors = [
  { name = "ComfyUI Turing Utils contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["comfyui_turing_utils_kernel*"]

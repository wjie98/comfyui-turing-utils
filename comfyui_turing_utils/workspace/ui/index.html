<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>素材画布 · Turing Utils</title
  ><link rel="stylesheet" href="ui/style.css" />
  <header>
    <strong>素材画布</strong
    ><input
      id="directory"
      value="materials/project"
      aria-label="工作目录"
      title="相对于当前实例 output 的项目目录"
    />
    <button id="open">打开项目</button>
    <select id="templates" aria-label="卡片库"></select>
    <button id="refresh-templates">刷新卡片库</button>
    <button id="add">添加卡片副本</button><button id="fit">适合视图</button
    ><span id="status" role="status"></span>
  </header>
  <main id="viewport" tabindex="0">
    <canvas id="wires"></canvas>
    <div id="world"></div>
    <p id="empty">
      在 ComfyUI 中保存 Canvas
      卡片，再从卡片库添加副本。拖动空白处平移，滚轮缩放。
    </p>
  </main>
  <script type="module" src="ui/app.js"></script>
</html>
